name: $(BuildDefinitionName)_$(SourceBranchName)_$(Date:yyyyMMdd)$(Rev:.r)
trigger: none
pr: none

parameters:
- name: PublishToPSGallery
  displayName: Publish to PowerShell Gallery
  type: boolean
  default: true
- name: ValidatePSGalleryNetworkAccess
  displayName: Validate PowerShell Gallery network access
  type: boolean
  default: false

resources:
  pipelines:
  - pipeline: _1es-EntraPowerShell-CI
    source: 1es-EntraPowerShell-CI
  repositories:
  - repository: 1ESPipelineTemplates
    type: git
    name: 1ESPipelineTemplates/1ESPipelineTemplates
    ref: refs/heads/main

extends:
  template: v1/1ES.Official.PipelineTemplate.yml@1ESPipelineTemplates
  parameters:
    settings:
      networkIsolationPolicy: Permissive, CFSClean, CFSClean2
      networkIsolationAdditionalDomainAllowList:
      - www.powershellgallery.com
    pool:
      name: MSSecurity-1ES-Build-Agents-Pool
      image: MSSecurity-1ES-Windows-2022
      os: windows
    sdl:
      sourceAnalysisPool:
        name: MSSecurity-1ES-Build-Agents-Pool
        image: MSSecurity-1ES-Windows-2022
        os: windows
    stages:
    - stage: release
      jobs:
      - job: approval
        displayName: Approval
        pool: server
        timeoutInMinutes: 720
        templateContext:
          type: releaseJob
          isProduction: true
        steps:
        - task: ApprovalTask@1
          inputs:
            environment: Production
            servicetreeguid: f3970205-d841-45de-8b2d-3a7d45846ae1

      - job: release
        dependsOn: approval
        condition: succeeded('approval')
        templateContext:
          type: releaseJob
          isProduction: true
        steps:
        - task: 1ES.DownloadPipelineArtifact@1
          inputs:
            pipeline: _1es-EntraPowerShell-CI
            artifactName: drop
            targetPath: '$(System.ArtifactsDirectory)/drop'
        - ${{ if eq(parameters.ValidatePSGalleryNetworkAccess, true) }}:
          - task: powershell@2
            displayName: Validate PowerShell Gallery network access
            inputs:
              targetType: inline
              pwsh: true
              script: |
                curl.exe --silent --show-error --output NUL --write-out 'PowerShell Gallery probe returned HTTP %{http_code}.\n' --request HEAD --connect-timeout 30 --max-time 60 https://www.powershellgallery.com/api/v2/package/
                if ($LASTEXITCODE -ne 0) {
                    throw "PowerShell Gallery network probe failed with curl exit code $LASTEXITCODE."
                }
        - ${{ if eq(parameters.PublishToPSGallery, true) }}:
          - task: 1ES.PublishNuget@1
            displayName: Publish Nuget package
            inputs:
              useDotNetTask: false
              packagesToPush: '$(System.ArtifactsDirectory)/drop/Microsoft.Entra*.nupkg'
              packageParentPath: '$(System.ArtifactsDirectory)'
              nuGetFeedType: external
              publishFeedCredentials: EntraPowerShell_PSGallery
